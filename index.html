<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Amphetamine Withdrawal Assessment Tool</title>
    <!-- Web App Capabilities (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063822.png">

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* Touch friendly optimizations */
        -webkit-tap-highlight-color: transparent;
        body {
            user-select: none;
            -webkit-user-select: none;
        }
        input, textarea {
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen pb-24 pt- safe-top">

    <!-- Header App Bar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-heart-pulse text-xl text-amber-400"></i>
            <h1 class="text-base font-bold tracking-wide truncate max-w-[200px] sm:max-w-none">Amphetamine Assessment</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openQRModal()" class="p-2 rounded-full bg-indigo-700 hover:bg-indigo-800 text-white transition" title="แชร์ QR Code">
                <i class="fa-solid fa-qrcode text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 mt-4">

        <!-- SECTION 1: แบบประเมิน -->
        <section id="view-assess" class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <h2 id="form-title" class="text-lg font-bold text-slate-900 mb-1">แบบประเมินอาการถอนแอมเฟตามีน</h2>
                <p class="text-xs text-slate-500 mb-4">โปรดเลือกอาการของผู้ป่วยตามความจริงในปัจจุบัน</p>

                <form id="assessment-form" class="space-y-4">
                    <div id="questions-container" class="space-y-4">
                        <!-- Dynamic generated questions -->
                    </div>

                    <button type="button" onclick="calculateScore()" class="w-full bg-indigo-600 active:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex justify-center items-center gap-2 text-base">
                        <i class="fa-solid fa-calculator"></i> ประเมินผลรวม
                    </button>
                </form>
            </div>

            <!-- Result Card -->
            <div id="result-box" class="hidden bg-white p-5 rounded-2xl shadow-lg border border-slate-200 transition-all">
                <div class="flex justify-between items-center border-b pb-3 mb-3">
                    <span class="text-xs font-semibold text-slate-400 uppercase">ผลการประเมิน</span>
                    <span id="res-date" class="text-xs text-slate-400"></span>
                </div>

                <div class="text-center my-3">
                    <div class="text-4xl font-black text-indigo-600 mb-1" id="res-score">0</div>
                    <div class="text-xs text-slate-400">คะแนนรวม</div>
                </div>

                <div id="res-badge" class="p-3 rounded-xl text-center font-bold text-sm mb-4 border">
                    <span id="res-level">Normal</span>
                </div>

                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-1">
                    <div class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                        <i class="fa-solid fa-user-nurse text-indigo-600"></i> แนวทางการดูแลรักษา
                    </div>
                    <p class="text-xs text-slate-600 leading-relaxed" id="res-guide">-</p>
                </div>

                <button onclick="saveResultHistory()" class="w-full mt-4 py-2.5 bg-slate-800 active:bg-slate-900 text-white text-xs font-semibold rounded-xl flex justify-center items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> บันทึกประวัติการประเมินนี้
                </button>
            </div>
        </section>

        <!-- SECTION 2: ประวัติการประเมิน (History) -->
        <section id="view-history" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-bold text-slate-900">ประวัติการประเมิน</h2>
                    <button onclick="clearHistory()" class="text-xs text-red-500 hover:text-red-700 font-medium">ล้างประวัติ</button>
                </div>
                <div id="history-list" class="space-y-2 text-xs text-slate-500">
                    <!-- Dynamic history items -->
                </div>
            </div>
        </section>

        <!-- SECTION 3: ตัวแก้ไขแบบประเมิน (Editor) -->
        <section id="view-editor" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-bold text-slate-900">จัดการแบบประเมิน</h2>
                    <button onclick="resetToDefault()" class="text-xs text-amber-600 font-medium">รีเซ็ตเริ่มต้น</button>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1">ชื่อแบบประเมิน</label>
                        <input type="text" id="edit-title" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div id="editor-questions" class="space-y-3"></div>

                    <button onclick="addQuestion()" class="w-full py-2.5 border-2 border-dashed border-indigo-300 text-indigo-600 font-bold rounded-xl text-xs hover:bg-indigo-50">
                        + เพิ่มข้อประเมินใหม่
                    </button>
                    <button onclick="saveSchema()" class="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-xs shadow">
                        บันทึกโครงสร้างแบบประเมิน
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar (Mobile App Style) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-center z-40">
        <button onclick="switchTab('assess')" id="nav-assess" class="flex flex-col items-center text-indigo-600 font-semibold text-[10px] gap-1">
            <i class="fa-solid fa-clipboard-check text-lg"></i>
            <span>ประเมิน</span>
        </button>
        <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center text-slate-400 font-medium text-[10px] gap-1">
            <i class="fa-solid fa-clock-rotate-left text-lg"></i>
            <span>ประวัติ</span>
        </button>
        <button onclick="switchTab('editor')" id="nav-editor" class="flex flex-col items-center text-slate-400 font-medium text-[10px] gap-1">
            <i class="fa-solid fa-sliders text-lg"></i>
            <span>ตั้งค่า/แก้ไข</span>
        </button>
    </nav>

    <!-- QR Code Dialog Modal -->
    <div id="qr-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white p-5 rounded-3xl shadow-2xl max-w-xs w-full text-center space-y-3">
            <h3 class="text-sm font-bold text-slate-900">สแกนเพื่อเปิดแบบประเมิน</h3>
            <div id="qrcode" class="flex justify-center p-3 bg-white border border-slate-100 rounded-2xl shadow-inner"></div>
            <p class="text-[11px] text-slate-400">ใช้กล้องมือถือสแกน QR Code นี้เพื่อเข้าใช้งานบนอุปกรณ์อื่น</p>
            <button onclick="closeQRModal()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">
                ปิดหน้าต่าง
            </button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const defaultSchema = {
            title: "แบบประเมินอาการถอนแอมเฟตามีน (Amphetamine Withdrawal)",
            questions: [
                { name: "อุณหภูมิ", options: [{ text: "< 37.0 C", score: 0 }, { text: "37.1 C – 37.5 C", score: 1 }, { text: "37.6 C – 38.0 C", score: 2 }, { text: "38.1 C – 38.5 C", score: 3 }, { text: "> 38.5 C", score: 4 }] },
                { name: "การรับรู้ บุคคล สถานที่ เวลา", options: [{ text: "ปกติ", score: 0 }, { text: "รู้เวลาไม่แน่นอน", score: 1 }, { text: "ไม่รู้เวลา / สถานที่", score: 2 }, { text: "ไม่รู้เวลา / สถานที่ / บุคคล", score: 3 }, { text: "ไม่รับรู้อะไรเลย", score: 4 }] },
                { name: "วิตกกังวล", options: [{ text: "อาการสงบ", score: 0 }, { text: "กังวลเล็กน้อย", score: 1 }, { text: "กังวลในอนาคต", score: 2 }, { text: "หวาดกลัว", score: 3 }, { text: "เคลื่อนไหวตลอดเวลา", score: 4 }] },
                { name: "อาการวุ่นวาย", options: [{ text: "พักผ่อนได้", score: 0 }, { text: "ไม่อยู่นิ่ง", score: 1 }, { text: "กระสับกระส่าย", score: 2 }, { text: "ผุดลุกผุดนั่ง", score: 3 }, { text: "เคลื่อนไหวตลอดเวลา", score: 4 }] },
                { name: "ประสาทหลอน", options: [{ text: "พักผ่อนได้", score: 0 }, { text: "ไม่อยู่นิ่ง", score: 1 }, { text: "กระสับกระส่าย", score: 2 }, { text: "ผุดลุกผุดนั่ง", score: 3 }, { text: "เคลื่อนไหวตลอดเวลา", score: 4 }] },
                { name: "ซึมเศร้า", options: [{ text: "ไม่พบ", score: 0 }, { text: "สีหน้าเรียบเฉย / แยกตัว", score: 1 }, { text: "ต้องกระตุ้นถึงจะตอบโต้", score: 2 }, { text: "กระตุ้นแล้วไม่ตอบโต้", score: 3 }, { text: "ทำร้ายตนเอง / มีแนวโน้มฆ่าตัวตาย", score: 4 }] },
                { name: "ก้าวร้าว", options: [{ text: "ไม่พบ", score: 0 }, { text: "มีสีหน้าท่าทางไม่เป็นมิตร", score: 1 }, { text: "ต่อต้านการบำบัด", score: 2 }, { text: "มีพฤติกรรมเอะอะโวยวาย", score: 3 }, { text: "ทำร้ายผู้อื่น / ข่มขู่เจ้าหน้าที่", score: 4 }] }
            ],
            rules: [
                { min: 0, max: 0, level: "Normal (ปกติ)", color: "bg-emerald-50 text-emerald-700 border-emerald-200", guide: "ปกติ" },
                { min: 1, max: 13, level: "Mild (อาการถอนพิษยาระดับน้อย)", color: "bg-amber-50 text-amber-700 border-amber-200", guide: "พูดคุยให้ข้อมูลแนวทางการรักษาในระยะถอนพิษยาเสพติด" },
                { min: 14, max: 20, level: "Moderate (อาการถอนพิษยาระดับปานกลาง)", color: "bg-orange-50 text-orange-700 border-orange-200", guide: "พูดคุยให้ข้อมูลแนวทางการรักษาในระยะถอนพิษ ถ้าอาการไม่สงบพิจารณาจำกัดพฤติกรรม" },
                { min: 21, max: 99, level: "Severe (อาการถอนพิษยาระดับรุนแรง)", color: "bg-rose-50 text-rose-700 border-rose-200", guide: "รายงานแพทย์ปรับการรักษา / พิจารณาฉีดยา PRN / จำกัดพฤติกรรม / มอบหมายงานให้ดูแลผู้ป่วยอย่างใกล้ชิด" }
            ]
        };

        let schema = JSON.parse(localStorage.getItem('app_schema')) || defaultSchema;
        let lastResult = null;

        function renderForm() {
            document.getElementById('form-title').innerText = schema.title;
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            schema.questions.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = "space-y-2 border-b border-slate-100 pb-3 last:border-0";
                
                let optionsHTML = q.options.map((opt, oIndex) => `
                    <label class="flex items-center gap-3 p-2.5 rounded-xl border border-slate-200 active:bg-indigo-50 active:border-indigo-300 transition">
                        <input type="radio" name="q_${qIndex}" value="${opt.score}" class="w-4 h-4 text-indigo-600" ${oIndex === 0 ? 'checked' : ''}>
                        <span class="text-xs text-slate-700 font-medium">${opt.text} <span class="text-[10px] text-slate-400">(${opt.score} คะแนน)</span></span>
                    </label>
                `).join('');

                card.innerHTML = `
                    <h3 class="text-xs font-bold text-slate-800">${qIndex + 1}. ${q.name}</h3>
                    <div class="space-y-1.5">${optionsHTML}</div>
                `;
                container.appendChild(card);
            });
        }

        function calculateScore() {
            let total = 0;
            schema.questions.forEach((q, qIndex) => {
                const selected = document.querySelector(`input[name="q_${qIndex}"]:checked`);
                if (selected) total += parseInt(selected.value);
            });

            const matched = schema.rules.find(r => total >= r.min && total <= r.max) || schema.rules[schema.rules.length - 1];

            document.getElementById('res-score').innerText = total;
            document.getElementById('res-level').innerText = matched.level;
            document.getElementById('res-guide').innerText = matched.guide;
            document.getElementById('res-badge').className = `p-3 rounded-xl text-center font-bold text-xs border ${matched.color}`;
            document.getElementById('res-date').innerText = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

            lastResult = { score: total, level: matched.level, date: new Date().toLocaleString('th-TH') };

            const resBox = document.getElementById('result-box');
            resBox.classList.remove('hidden');
            resBox.scrollIntoView({ behavior: 'smooth' });
        }

        function saveResultHistory() {
            if (!lastResult) return;
            let history = JSON.parse(localStorage.getItem('app_history')) || [];
            history.unshift(lastResult);
            localStorage.setItem('app_history', JSON.stringify(history));
            alert('บันทึกประวัติการประเมินแล้ว');
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('app_history')) || [];
            if (history.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-slate-400 text-xs">ไม่มีประวัติการประเมิน</div>`;
                return;
            }
            container.innerHTML = history.map(item => `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center">
                    <div>
                        <div class="font-bold text-slate-800 text-xs">${item.level}</div>
                        <div class="text-[10px] text-slate-400">${item.date}</div>
                    </div>
                    <div class="text-base font-extrabold text-indigo-600">${item.score} คะแนน</div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('ยืนยันล้างประวัติการประเมินทั้งหมด?')) {
                localStorage.removeItem('app_history');
                renderHistory();
            }
        }

        function switchTab(tab) {
            ['assess', 'history', 'editor'].forEach(t => {
                document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
                const navBtn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    navBtn.className = "flex flex-col items-center text-indigo-600 font-semibold text-[10px] gap-1";
                } else {
                    navBtn.className = "flex flex-col items-center text-slate-400 font-medium text-[10px] gap-1";
                }
            });

            if (tab === 'history') renderHistory();
            if (tab === 'editor') renderEditor();
        }

        function renderEditor() {
            document.getElementById('edit-title').value = schema.title;
            const container = document.getElementById('editor-questions');
            container.innerHTML = '';
            schema.questions.forEach((q, qIndex) => {
                const div = document.createElement('div');
                div.className = "p-3 border rounded-xl bg-slate-50 space-y-2";
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] font-bold text-slate-400">ข้อที่ ${qIndex + 1}</span>
                        <button onclick="removeQuestion(${qIndex})" class="text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <input type="text" value="${q.name}" onchange="schema.questions[${qIndex}].name = this.value" class="w-full border rounded p-1.5 text-xs">
                `;
                container.appendChild(div);
            });
        }

        function addQuestion() {
            schema.questions.push({ name: "ข้อประเมินใหม่", options: [{ text: "ปกติ", score: 0 }, { text: "ผิดปกติ", score: 1 }] });
            renderEditor();
        }

        function removeQuestion(idx) {
            schema.questions.splice(idx, 1);
            renderEditor();
        }

        function saveSchema() {
            schema.title = document.getElementById('edit-title').value;
            localStorage.setItem('app_schema', JSON.stringify(schema));
            renderForm();
            switchTab('assess');
            alert('บันทึกข้อมูลเรียบร้อยแล้ว');
        }

        function resetToDefault() {
            if (confirm('รีเซ็ตเป็นค่าเริ่มต้น?')) {
                schema = JSON.parse(JSON.stringify(defaultSchema));
                localStorage.removeItem('app_schema');
                renderForm();
                switchTab('assess');
            }
        }

        function openQRModal() {
            document.getElementById('qr-modal').classList.remove('hidden');
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            new QRCode(container, { text: window.location.href, width: 160, height: 160 });
        }

        function closeQRModal() {
            document.getElementById('qr-modal').classList.add('hidden');
        }

        // Register Service Worker for Offline Mode
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', e => e.waitUntil(caches.open('app-v1').then(c => c.addAll(['./']))));
                    self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        renderForm();
    </script>
</body>
</html>
